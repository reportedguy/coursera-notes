name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
