<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How coursera-notes works: a course link is fetched read-only into lesson packs at zero tokens, your agent classifies the course and writes the pages, and the build produces one notebook file.">
  <style>
    .bg{fill:#ffffff}.card{fill:#f6f5f4;stroke:#e5e3df}.agent{fill:#e6e0f5;stroke:#c9bff0}.out{fill:#d9f3e1;stroke:#a9dcb8}
    .t{fill:#1a1a1a;font-weight:600;font-size:19px}.s{fill:#5d5b54;font-size:14px}.lane{fill:#787671;font-size:13px;font-weight:600;letter-spacing:.08em}
    .arrow{stroke:#a4a097;stroke-width:2;fill:none}.head{fill:#a4a097}.band{fill:#fafaf9}.bandA{fill:#f3f0fb}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#202020;stroke:#3f3f3f}.agent{fill:#2a2540;stroke:#4b4280}.out{fill:#1c3326;stroke:#2f5c40}
      .t{fill:#f1f0ee}.s{fill:#b5b3ad}.lane{fill:#9b9a97}.arrow{stroke:#7f7d78}.head{fill:#7f7d78}.band{fill:#161b22}.bandA{fill:#1b1830}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="bg" width="1200" height="360" rx="16"/>
  <rect class="band" x="20" y="44" width="690" height="296" rx="12"/>
  <rect class="bandA" x="730" y="44" width="450" height="296" rx="12"/>
  <text class="lane" x="40" y="32">ZERO TOKENS · DETERMINISTIC PYTHON</text>
  <text class="lane" x="750" y="32">YOUR AI AGENT</text>

  <rect class="card" x="40" y="70" width="190" height="110" rx="12"/>
  <text class="t" x="60" y="108">Course link</text>
  <text class="s" x="60" y="134">course, specialization</text>
  <text class="s" x="60" y="154">or certificate</text>

  <rect class="card" x="270" y="70" width="190" height="110" rx="12"/>
  <text class="t" x="290" y="108">Fetch</text>
  <text class="s" x="290" y="134">your session, read-only,</text>
  <text class="s" x="290" y="154">paced, fetched once</text>

  <rect class="card" x="500" y="70" width="190" height="110" rx="12"/>
  <text class="t" x="520" y="108">Lesson packs</text>
  <text class="s" x="520" y="134">clean transcripts, readings,</text>
  <text class="s" x="520" y="154">your quiz attempts</text>

  <rect class="agent" x="750" y="70" width="190" height="110" rx="12"/>
  <text class="t" x="770" y="108">Classify</text>
  <text class="s" x="770" y="134">pick the course-type</text>
  <text class="s" x="770" y="154">profile (≈3k tokens)</text>

  <rect class="agent" x="970" y="70" width="190" height="110" rx="12"/>
  <text class="t" x="990" y="108">Write pages</text>
  <text class="s" x="990" y="134">one writer per module,</text>
  <text class="s" x="990" y="154">in parallel</text>

  <rect class="out" x="500" y="220" width="660" height="100" rx="12"/>
  <text class="t" x="525" y="258">notebook.html</text>
  <text class="s" x="525" y="284">Module pages · course map · mind map · question practice</text>
  <text class="s" x="525" y="304">One offline file you can edit · or a private Claude artifact</text>

  <rect class="card" x="40" y="220" width="420" height="100" rx="12"/>
  <text class="t" x="60" y="258">Safety stops</text>
  <text class="s" x="60" y="284">Login expiry, captcha, HTTP 429 or 403 → stop and ask.</text>
  <text class="s" x="60" y="304">Your password is never seen. Data stays on your machine.</text>

  <path class="arrow" d="M230 125H266" marker-end="url(#a)"/>
  <path class="arrow" d="M460 125H496" marker-end="url(#a)"/>
  <path class="arrow" d="M690 125H746" marker-end="url(#a)"/>
  <path class="arrow" d="M940 125H966" marker-end="url(#a)"/>
  <path class="arrow" d="M1065 180V216" marker-end="url(#a)"/>
</svg>
