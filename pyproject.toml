[project]
name = "coursera-notes"
version = "0.2.0"
description = "Turn the Coursera courses you're enrolled in into one editable study notebook, written by your own AI agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "pydantic>=2.8",
  "typer>=0.12",
  "pyyaml>=6.0",
  "selectolax>=0.3",
  "pillow>=10.4",
  "markdownify>=0.13",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
slides = ["imagehash>=4.3", "scenedetect[opencv-headless]>=0.6.4"]

[project.scripts]
notebook = "sv.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
