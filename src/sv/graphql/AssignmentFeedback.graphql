fragment FullFeedback on Submission_Feedback {
  assignmentLevelRubrics {
    ...RubricFeedback
    __typename
  }
  feedbackId: id
  outcome {
    ...OverallOutcome
    __typename
  }
  parts {
    ...FeedbackPart
    __typename
  }
  instructions {
    ...SubmissionInstructions
    __typename
  }
  __typename
}

query AssignmentFeedback($courseId: ID!, $itemId: ID!) {
  SubmissionState {
    queryState(courseId: $courseId, itemId: $itemId) {
      ... on Submission_QueryStateFailure {
        ...QueryStateFailure
        __typename
      }
      ... on Submission_SubmissionState {
        feedback {
          ...FullFeedback
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment OverallOutcome on Submission_OverallOutcome {
  latestScore
  highestScore
  maxScore
  __typename
}

